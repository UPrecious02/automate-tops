order: 2
title: AI Appointment Receptionist
category: Customer communication
workflowName: WhatsApp AI Receptionist
summary: A WhatsApp receptionist for a dental clinic. It answers service and pricing questions, checks real calendar availability and books appointments once the patient confirms.
seoDescription: An n8n WhatsApp receptionist by John Eyitope that answers clinic questions, checks Google Calendar availability and books confirmed appointments.
status: Built and tested
accent: orange

problem: >
  Clinics lose bookings when enquiries arrive while staff are busy or the clinic is
  closed. Agreeing a time takes several messages, pulls staff away from the patients
  in front of them, and double bookings happen when the chat and the calendar drift
  out of sync.

solution: >
  Patient messages go to an AI agent that answers from a pricing knowledge base in
  Google Sheets and works out the service, date and time the patient wants. Its reply
  is parsed into structured fields, and the workflow decides what happens next:
  escalate to staff, check the calendar, offer other times when a slot is taken, or
  book once the patient confirms. Every conversation is logged to a sheet.

workflowSteps:
  - stage: TRIGGER
    title: WhatsApp message
    description: A patient message reaches the workflow through the WhatsApp trigger.
  - stage: AI
    title: Receptionist agent
    description: An agent with memory, a pricing sheet and calendar access replies and returns structured fields.
  - stage: LOGIC
    title: Escalate or continue
    description: The parsed fields decide escalation, slot checks and whether the patient has confirmed.
  - stage: SYSTEM
    title: Calendar check
    description: Google Calendar is checked for the requested time and free slots are worked out.
  - stage: ACTION
    title: Book and reply
    description: The event is created with patient and service details, then a confirmation goes out.

implementation:
  - The agent reads clinic prices from a Google Sheets knowledge base instead of hard coded text.
  - A code node parses the agent's output into fields the workflow can branch on.
  - Escalation sends the patient a handoff message and notifies the clinic team on WhatsApp.
  - Availability is checked against Google Calendar before a time is confirmed, and taken slots return alternatives.
  - The booking is created only after the patient replies YES or CONFIRM, with a reminder 30 minutes before.
  - Every conversation is appended to a log sheet.

tools: [n8n, WhatsApp Business API, Anthropic API, Google Calendar, Google Sheets]
technicalSkills: [AI agent design, Structured output parsing, Availability logic, Calendar API integration, Escalation design]

validationNote: Built and run with a test clinic, Bright Smile Dental Clinic, and test patients. The screenshots below come from those runs.
validation:
  - The receptionist greeted a patient and listed services and prices from the knowledge base.
  - A request for a time that was already booked returned the open slots for that day.
  - After the patient confirmed, the appointment was created in Google Calendar with the service, time and booking source.

designDecisions:
  - The model never decides availability. Google Calendar is the single source of truth.
  - Bookings need an explicit YES or CONFIRM, which prevents accidental appointments.
  - The agent's reply is parsed into fields, so routing never depends on reading free text.

limitations:
  - The test booking shows the phone field as unknown. The patient's WhatsApp number should be written to the event automatically.
  - Weekday phrases such as "Tuesday by 11" need careful date resolution, so this is the area to test most before going live.
  - Designed around one clinic calendar.

futureImprovements:
  - Write the patient's WhatsApp number to every event.
  - Send reminder messages on WhatsApp before each appointment.

