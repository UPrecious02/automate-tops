order: 1
title: Conversational Ordering & Support
category: Customer communication
workflowName: Restaurant WhatsApp Ordering
summary: A WhatsApp ordering assistant for a restaurant. It takes orders from the live menu, saves them to a sheet, handles payment receipts and confirms paid orders automatically.
seoDescription: How John Eyitope built a WhatsApp ordering assistant in n8n that takes orders from a live menu, records them in Google Sheets and confirms payments.
status: Built and tested
accent: lime

problem: >
  Restaurants that take orders on WhatsApp usually have someone reading every chat,
  quoting prices, writing orders down and checking bank transfer receipts by hand.
  Orders slip through during busy hours, and the owner has no single record of what
  was ordered and what has been paid.

solution: >
  Customer messages go to an AI agent that reads the live menu from Google Sheets,
  takes the order, asks about pickup or delivery and sends the bill. Completed orders
  are parsed and saved to an orders sheet. Receipt images skip the agent and go
  straight to the owner. When the owner marks an order as Paid, the customer is told
  automatically, and a summary of the day's orders is sent on a schedule.

workflowSteps:
  - stage: TRIGGER
    title: Message received
    description: The WhatsApp trigger receives the message, and a filter keeps text and image messages.
  - stage: LOGIC
    title: Receipt or conversation
    description: Images are treated as payment receipts and go to the owner. Text goes to the agent.
  - stage: AI
    title: Ordering agent
    description: An agent with conversation memory reads the menu sheet, takes the order and prepares the bill.
  - stage: SYSTEM
    title: Orders sheet
    description: Completed orders are parsed and saved to Google Sheets.
  - stage: ACTION
    title: Confirm and notify
    description: The customer gets a confirmation, and a Paid status update notifies both owner and customer.

implementation:
  - A filter passes only text and image messages, and an If node separates receipt images from normal conversation.
  - Receipt images are forwarded to the owner with the order details, and the customer gets an acknowledgement.
  - The AI agent uses the menu sheet as a tool and keeps the order context across messages with simple memory.
  - An Order Complete check decides when to parse the order and save it with an append or update step.
  - A Google Sheets trigger watches for status changes and sends payment confirmations when an order is marked Paid.
  - A scheduled flow reads all orders, builds a daily summary and sends it on WhatsApp.

tools: [n8n, WhatsApp Business API, Anthropic API, Google Sheets]
technicalSkills: [AI agents with tools, Image and text routing, Event driven triggers, Data parsing, Scheduled reporting]

validationNote: Built and run end to end with test orders. The screenshots below come from those runs.
validation:
  - A test customer ordered from the menu and received an itemised bill with the takeaway pack added for pickup.
  - Choosing pickup moved the conversation straight to payment details.
  - Test orders were saved to the orders sheet with customer, order type, total and payment status.
  - Orders covered both pickup and delivery.

designDecisions:
  - Receipt images bypass the AI agent entirely, so payments always reach a person.
  - Payment is confirmed by the owner updating the sheet, not by the AI reading a receipt.
  - The menu lives in a sheet the restaurant can edit without touching the workflow.

limitations:
  - The agent works out the bill from menu prices, so totals should be checked until a code step recalculates them.
  - Payment confirmation depends on staff updating the order status.

futureImprovements:
  - Recalculate every total in a code step before the bill is sent.
  - Add delivery fees by location.

