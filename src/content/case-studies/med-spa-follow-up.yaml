order: 4
title: Med Spa Customer Follow Up & Recovery
category: Customer communication
workflowName: Med Spa Follow Up & Recovery Engine
summary: An SMS follow up engine for a med spa. It sends aftercare, recovers missed appointments, prompts rebooking, reactivates inactive clients and routes replies to staff.
seoDescription: A follow up and recovery engine by John Eyitope built with n8n, Airtable and Twilio for aftercare, no show recovery, rebooking and reactivation.
status: Built and tested
accent: orange

problem: >
  After a treatment, clients need aftercare and a check in. Missed appointments need a
  quick, polite attempt to rebook, and clients who have not been back in a while need a
  nudge. When all of this depends on staff memory, follow ups are inconsistent, clients
  drift away, and nobody can see who has been contacted.

solution: >
  Airtable holds customers, appointments, a follow up log and staff tasks. Four flows
  run on top of it: post treatment follow up, no show recovery, a daily rebooking check
  and a daily reactivation check. Each one checks marketing opt in, whether the message
  was already sent and a cap on attempts before sending an SMS through Twilio and
  logging it. Replies arrive by webhook, are matched to the customer and classified by
  AI as booking requests, opt outs or issues that need staff.

workflowSteps:
  - stage: TRIGGER
    title: Events and schedules
    description: Completed and missed appointments, plus daily rebooking and reactivation checks.
  - stage: LOGIC
    title: Guard checks
    description: Marketing opt in, already sent and attempt caps are checked before every message.
  - stage: ACTION
    title: SMS through Twilio
    description: Aftercare, recovery, rebooking and reactivation messages go out.
  - stage: AI
    title: Classify replies
    description: Inbound SMS is matched by phone and sorted into booking, opt out or escalation.
  - stage: SYSTEM
    title: Records and staff tasks
    description: Every message is logged, follow ups pause on escalation and staff tasks are created.

implementation:
  - Four separate flows, grouped on the canvas, for post treatment, no show recovery, rebooking and reactivation.
  - Every send path checks marketing opt in and whether the message was already sent, so nobody is messaged twice.
  - Code nodes enforce caps on rebooking and no show messages. When a cap is reached, a staff task is created instead.
  - Replies come in through a Twilio webhook and are matched to a customer by phone. Unknown senders are logged separately.
  - Escalated replies get a high or normal priority, the follow up is paused and staff are notified.

tools: [n8n, Airtable, Twilio, Webhooks]
technicalSkills: [Event driven workflows, Deduplication and caps, AI reply classification, Escalation rules, Activity logging]

validationNote: Built and run with test customers and appointments. The screenshots below come from those runs.
validation:
  - Test SMS messages were sent through Twilio and recorded in the follow up log.
  - The log records every message with its channel and the time it was sent.
  - Test appointments covered completed, no show, cancelled and scheduled states, so each path could be exercised.

designDecisions:
  - Opt in is checked before any message is sent, on every path.
  - When a cap is reached, a person takes over through a staff task rather than another automated message.
  - A reply flagged as an issue pauses automation for that client.

limitations:
  - Tested on a Twilio trial account, so messages carry the trial prefix until a paid number is connected.
  - Follow up timing windows need to be agreed with the clinic.

futureImprovements:
  - Ask for a review after positive check ins.
  - A weekly summary for the clinic of recovered and rebooked clients.

