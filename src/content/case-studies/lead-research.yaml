order: 5
title: AI Lead Research & Prospecting
category: Research and information
workflowName: AI Lead Research & Prospecting
summary: Finds businesses from a simple form, removes duplicates, researches each website with AI and writes scored leads to Google Sheets.
seoDescription: An n8n lead research workflow by John Eyitope that discovers businesses, deduplicates them, scores each one with AI and writes leads to Google Sheets.
status: Demonstration
accent: lime

problem: >
  Manual prospecting means hours of searching, copying details into a spreadsheet and
  checking whether a business is already on the list. The result is inconsistent data,
  duplicates and no record of why a lead was chosen.

solution: >
  A run starts from a form with the search criteria. Businesses are discovered through
  the Google Places API and an AI web search step, then normalised and deduplicated. A
  loop then handles each business: fetch its website, prepare a research brief, run AI
  analysis and scoring, build a clean row and append it to Google Sheets.

workflowSteps:
  - stage: TRIGGER
    title: Research form
    description: A form collects the search criteria and starts the run.
  - stage: SYSTEM
    title: Discover businesses
    description: The Google Places API and an AI web search step find candidate businesses.
  - stage: LOGIC
    title: Normalise and dedupe
    description: Records from both sources are cleaned and duplicates are removed.
  - stage: AI
    title: Research and score
    description: Each website is fetched, a brief is prepared and AI scores the fit.
  - stage: ACTION
    title: Write to Sheets
    description: A clean row for each business is appended to Google Sheets.

implementation:
  - A form trigger lets anyone start a run without opening n8n.
  - Two discovery sources, the Google Places API and an AI web search step, widen the search.
  - A code node normalises records and removes duplicates before any research begins.
  - A per business loop fetches each website and prepares a research brief for the AI.
  - AI analysis returns a score, and a code node turns it into a consistent sheet row.

tools: [n8n, Google Places API, OpenAI API, HTTP Request, Google Sheets]
technicalSkills: [API integration, Data normalisation, Deduplication, Batch processing with loops, AI scoring]

validationNote: The workflow structure is shown below. It is designed to handle each of these cases.
validation:
  - A business found by both sources becomes one record before research starts.
  - Each business is researched on its own inside the loop.
  - Every lead is written to the sheet with its score.

designDecisions:
  - Deduplication happens before the AI step, so no research is paid for twice.
  - Two discovery sources make the list wider than either one alone.

limitations:
  - Research quality depends on each business's website. Thin websites lead to weaker scores.
  - The Google Places API charges per request, so search size should be set with costs in mind.

futureImprovements:
  - Scheduled runs that only add new businesses.
  - Send qualified leads straight to a CRM.

