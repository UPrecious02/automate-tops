order: 3
title: Email Triage & Follow Up
category: Business process automation
workflowName: AI Email Executive Assistant
summary: An inbox assistant that analyses every new email, drafts replies for review, flags urgent messages and sends a daily digest of the last 24 hours.
seoDescription: John Eyitope's n8n email assistant analyses new Gmail messages, drafts replies for review, sends alerts and delivers a daily AI digest.
status: Built and tested
accent: lime

problem: >
  A busy inbox mixes enquiries, invoices, support requests and noise. Someone has to
  read everything, decide what matters and remember to reply. Important emails sit
  untouched, and there is no quick view of what came in or what is still waiting.

solution: >
  Each new Gmail message is analysed by an AI model with a structured output parser.
  Based on that analysis, the workflow creates a draft reply, marks the email as read
  and sends an alert for anything important. A second flow runs on a schedule,
  collects the last 24 hours of email and sends a digest grouped by priority,
  revenue opportunities and messages awaiting a response.

workflowSteps:
  - stage: TRIGGER
    title: New email
    description: The Gmail trigger picks up each new message and extracts its content.
  - stage: AI
    title: Analyse
    description: An AI model analyses the email and an output parser returns a fixed structure.
  - stage: LOGIC
    title: Decide
    description: If nodes decide whether a draft reply and an alert are needed.
  - stage: ACTION
    title: Draft and alert
    description: A draft is created, the email is marked as read and alerts go out.
  - stage: SYSTEM
    title: Daily digest
    description: A schedule fetches the last 24 hours of email, summarises it with AI and sends the digest.

implementation:
  - Email content is extracted into clean fields before the AI step.
  - An output parser forces the analysis into a fixed structure, so later steps can rely on it.
  - Replies are saved as Gmail drafts and are never sent automatically.
  - Important emails trigger a separate alert email.
  - The digest flow aggregates the day's emails, generates a summary with AI, sends it and logs that it was sent.

tools: [n8n, OpenAI API, Gmail]
technicalSkills: [Email classification, Structured output parsing, Human in the loop design, Scheduled workflows, AI summarisation]

validationNote: Built and run on a real inbox. The screenshots below come from those runs.
validation:
  - The scheduled digest ran and summarised the previous 24 hours of email.
  - The digest separated critical and high priority emails, revenue opportunities and messages awaiting a response.
  - New emails were processed through analysis, drafting and alerts.

designDecisions:
  - Replies are drafted, not sent, so a person always controls what leaves the inbox.
  - A structured output parser keeps the AI's answer predictable enough to branch on.

limitations:
  - The digest currently arrives as plain text, so formatting markers show in the email. An HTML version is the next fix.
  - Priority rules need reviewing as the inbox changes over time.

futureImprovements:
  - Send the digest as formatted HTML.
  - Add reply templates for the most common email types.

